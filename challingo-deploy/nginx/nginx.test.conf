worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Host ports must match challingo-deploy/api.env (API_HOST_PORT, WEB_HOST_PORT) and docker ps.
    # Set-PublishSettings.ps1 inserts SCAFFOLD_BEGIN/END blocks — example below.

    # SCAFFOLD_BEGIN: myshop
    # =============================================================================
    # example.com — myshop
    #   http://example.com/         -> 127.0.0.1:3000  (WEB_HOST_PORT)
    #   http://example.com/api/     -> 127.0.0.1:8080  (API_HOST_PORT)
    # =============================================================================

    upstream myshop_web {
        server 127.0.0.1:3000;
    }
    upstream myshop_api {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name example.com www.example.com;

        client_max_body_size 50M;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        location ^~ /api/ {
            proxy_pass http://myshop_api;
            proxy_http_version 1.1;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /uploads/ {
            proxy_pass http://myshop_api/uploads/;
            proxy_http_version 1.1;
            proxy_connect_timeout 120s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://myshop_web;
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # SCAFFOLD_END: myshop

    include /etc/nginx/conf.d/*.conf;
}
