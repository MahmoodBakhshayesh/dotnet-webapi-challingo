name: challingo
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter



  cupertino_icons: ^1.0.8
  hooks_riverpod: ^3.2.1
  flutter_riverpod: ^3.2.1
  flutter_hooks:
  intl: ^0.20.2
  path: ^1.9.0
  collection: ^1.19.0
  sqflite: ^2.4.2
  web: ^1.1.0
  go_router: ^17.1.0
  get_it: ^9.2.0
  dio: ^5.9.1
  signalr_netcore: ^1.4.4
  shared_preferences: ^2.2.0
  flutter_spinkit: ^5.2.2
  auto_size_text: ^3.0.0
  toastification: ^3.0.3
  logger: ^2.6.2
  app_device_net_info: ^0.0.6
  sembast: ^3.8.6
  sembast_web: ^2.4.4+1
  path_provider: ^2.1.5
  fast_cached_network_image: ^1.3.3+5
  pinput: ^6.0.2
  http_parser: ^4.1.2
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  readsms: ^0.2.0+4
  flutter_rating_stars: ^1.1.0
  input_quantity: ^2.6.0
  action_slider: ^0.7.0
  riverpod_sqflite: ^0.4.2
  unified_fields: ^1.0.1+3
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_timezone: ^5.1.0
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^10.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/data/
    - assets/sounds/
    - assets/fonts/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-800.ttf
          weight: 800
